services:
  studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wandora-studio-designer
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3210}
      PUBLIC_URL: ${PUBLIC_URL:-https://designer-vigia.wandora.com.br}
      DATA_DIR: ${DATA_DIR:-/app/data}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      SESSION_SECRET: ${SESSION_SECRET:-}
      STUDIO_ADMIN_EMAIL: ${STUDIO_ADMIN_EMAIL:-admin@wandora.com.br}
      STUDIO_ADMIN_PASSWORD_HASH: ${STUDIO_ADMIN_PASSWORD_HASH:-}
      STUDIO_DEV_PASSWORD: ${STUDIO_DEV_PASSWORD:-}
      STUDIO_LOGIN_ASSET_B64: ${STUDIO_LOGIN_ASSET_B64:-}
      STUDIO_LOGO_ASSET_B64: ${STUDIO_LOGO_ASSET_B64:-}
      JEV_BASE_URL: ${JEV_BASE_URL:-https://api.typesafe.ai}
      JEV_API_KEY: ${JEV_API_KEY:-}
      JEV_MODEL: ${JEV_MODEL:-jev-latest}
      JEV_TIMEOUT_MS: ${JEV_TIMEOUT_MS:-20000}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-openai/gpt-oss-20b}
      NVIDIA_TIMEOUT_MS: ${NVIDIA_TIMEOUT_MS:-120000}
      CHUTES_BASE_URL: ${CHUTES_BASE_URL:-https://llm.chutes.ai/v1}
      CHUTES_API_KEY: ${CHUTES_API_KEY:-}
      CHUTES_TIMEOUT_MS: ${CHUTES_TIMEOUT_MS:-60000}
      CHUTES_IMAGE_URL: ${CHUTES_IMAGE_URL:-}
      CHUTES_IMAGE_MODEL: ${CHUTES_IMAGE_MODEL:-}
      CHUTES_VIDEO_URL: ${CHUTES_VIDEO_URL:-}
      CHUTES_VIDEO_MODEL: ${CHUTES_VIDEO_MODEL:-}
      STT_BASE_URL: ${STT_BASE_URL:-http://studio-asr:8000}
      STT_MODEL: ${STT_MODEL:-Systran/faster-whisper-base}
      STT_LANGUAGE: ${STT_LANGUAGE:-pt}
      STT_TIMEOUT_MS: ${STT_TIMEOUT_MS:-180000}
    ports:
      - "127.0.0.1:${STUDIO_HOST_PORT:-3210}:${PORT:-3210}"
    expose:
      - "3210"
    networks:
      - default
      - vigia-edge
    volumes:
      - studio_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      studio-asr:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3210)+'/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  studio-asr:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: wandora-studio-designer-asr
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - default
    volumes:
      - studio_asr_cache:/home/ubuntu/.cache/huggingface/hub
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://127.0.0.1:8000/health
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 5

volumes:
  studio_data:
    name: wandora-studio-designer-data
  studio_asr_cache:
    name: wandora-studio-designer-asr-cache

networks:
  vigia-edge:
    external: true
    name: vigia-edge
