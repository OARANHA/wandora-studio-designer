services:
  studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wandora-studio-designer
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${STUDIO_HOST_PORT:-3210}:${PORT:-3210}"
    volumes:
      - studio_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3210)+'/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  studio_data:
    name: wandora-studio-designer-data
