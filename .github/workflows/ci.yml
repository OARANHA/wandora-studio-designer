name: Studio CI

on:
  push:
    branches:
      - feat/studio-designer-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check
        run: |
          node --check src/server.mjs
          node --check src/ai/jev.mjs
          node --check src/ai/nvidia.mjs
          node --check src/ai/writer.mjs
          node --check src/commands/router.mjs
          node --check src/commands/adjustments.mjs
          node --check public/studio.js
          node --check public/render.mjs
          node --check public/variation.mjs
          node --check public/export.mjs
          node --check public/live.mjs

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build --tag wandora-studio-designer:ci .
